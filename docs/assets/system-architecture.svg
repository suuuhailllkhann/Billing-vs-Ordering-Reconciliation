<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-labelledby="title description">
  <title id="title">Pharmacy renewal platform architecture</title>
  <desc id="description">Synthetic data flows through feature engineering, leakage-safe temporal machine learning, a locked Logistic Regression model, MLflow, FastAPI, PostgreSQL, and Docker Compose. AWS is shown separately as a future-only deployment path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="510" rx="24" fill="#f8fafc"/>
  <text x="56" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">System architecture</text>
  <text x="56" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Validated local workflow · deterministic synthetic data only</text>

